<script>
/* přepínání Budoucí / Uplynulé */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(t){tabs.forEach(b=>{const on=b===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;document.getElementById(b.getAttribute('aria-controls')).hidden=!on})}
tabs.forEach((b,i)=>{b.addEventListener('click',()=>show(b));b.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){const n=tabs[(i+d+tabs.length)%tabs.length];show(n);n.focus()}})});
show(tabs.find(b=>b.getAttribute('aria-selected')==='true'));
</script>
